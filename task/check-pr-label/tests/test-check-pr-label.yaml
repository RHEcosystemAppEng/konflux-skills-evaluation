apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-check-pr-label
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script (unused by this test).
  tasks:
    # No merge request can exist for this SHA at an unreachable server, so
    # the Task must fail closed with "false" rather than erroring out.
    - name: run-check-pr-label
      taskRef:
        name: check-pr-label
      params:
        - name: current-sha
          value: "deadbeef"
        - name: label-name
          value: "evaluate"
        - name: gitlab-server-url
          value: "http://127.0.0.1:1"
        - name: gitlab-project-path
          value: "test%2Ffixture"
        - name: git-token-secret-name
          value: "test-dummy-gitlab-sa"
        - name: git-token-secret-key
          value: "password"

    - name: verify-result
      runAfter:
        - run-check-pr-label
      params:
        - name: should-evaluate
          value: $(tasks.run-check-pr-label.results.should-evaluate)
      taskSpec:
        params:
          - name: should-evaluate
            type: string
        steps:
          - name: check-fail-closed
            image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
            env:
              - name: SHOULD_EVALUATE
                value: $(params.should-evaluate)
            script: |
              #!/bin/bash
              set -e
              echo "should-evaluate=${SHOULD_EVALUATE}"
              if [ "$SHOULD_EVALUATE" != "false" ]; then
                echo "FAIL: expected should-evaluate=false (fail-closed) for an unreachable GitLab server"
                exit 1
              fi
              echo "check-pr-label correctly failed closed"
