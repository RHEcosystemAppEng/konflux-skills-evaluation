# Opt-in gate for a Tier-B/expensive chain further down a pipeline: "true"
# only when the merged merge request for the given commit carries a given
# label. Fails closed -- no merged MR at all (e.g. a direct push) also
# returns "false".
#
# GitLab-specific by design: calls the GitLab REST API
# (`/projects/:id/repository/commits/:sha/merge_requests`) directly. Reusable
# across any GitLab-hosted project -- gitlab-server-url/gitlab-project-path/
# label-name are all parameterized below (defaulted to the values
# agentic-plugins itself uses), and git-token-secret-name/-key let a caller
# point at their own GitLab personal/project access token Secret.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-pr-label
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: "0.1.0"
spec:
  description: >-
    Checks whether the MERGED merge request for a given commit SHA on a
    GitLab project carries a given label. Returns "true" only in that case;
    "false" otherwise, including when no merged MR is found at all
    (fail-closed). Intended to gate an expensive/opt-in chain later in a
    pipeline (e.g. an LLM evaluation step) behind an explicit label on the
    merged MR.
  params:
    - name: current-sha
      type: string
      description: Commit SHA to look up merge requests for.
    - name: label-name
      type: string
      default: "evaluate"
      description: Label that must be present on the merged MR for this result to be "true".
    - name: gitlab-server-url
      type: string
      default: "https://gitlab.cee.redhat.com"
      description: Base URL of the GitLab server hosting the project.
    - name: gitlab-project-path
      type: string
      default: "ai5-marketplace%2Fagentic-plugins"
      description: >-
        URL-encoded "namespace%2Fproject" path of the GitLab project (as
        used in GitLab's REST API project ID position).
    - name: git-token-secret-name
      type: string
      default: "agentic-plugins-gitlab-sa"
      description: Name of the Secret containing a GitLab access token with API read access to the project.
    - name: git-token-secret-key
      type: string
      default: "password"
      description: Key within git-token-secret-name holding the GitLab access token.
  results:
    - name: should-evaluate
      description: "'true' only if a MERGED MR for current-sha carries the label-name label; 'false' otherwise (including when no merged MR is found at all)"
  steps:
    - name: check-label
      image: registry.access.redhat.com/ubi9/python-311:latest
      env:
        - name: CURRENT_SHA
          value: $(params.current-sha)
        - name: LABEL_NAME
          value: $(params.label-name)
        - name: GITLAB_SERVER_URL
          value: $(params.gitlab-server-url)
        - name: GITLAB_PROJECT_PATH
          value: $(params.gitlab-project-path)
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.git-token-secret-name)
              key: $(params.git-token-secret-key)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        python3 << 'PYEOF' > "$(results.should-evaluate.path)"
        import json
        import os
        import ssl
        import sys
        import urllib.request

        sha = os.environ["CURRENT_SHA"]
        token = os.environ["GIT_TOKEN"]
        label_name = os.environ["LABEL_NAME"]
        server_url = os.environ["GITLAB_SERVER_URL"]
        project_path = os.environ["GITLAB_PROJECT_PATH"]
        url = (
            f"{server_url}/api/v4/projects/{project_path}"
            f"/repository/commits/{sha}/merge_requests"
        )
        req = urllib.request.Request(url, headers={"PRIVATE-TOKEN": token})
        ctx = ssl._create_unverified_context()
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                mrs = json.loads(resp.read())
        except Exception as e:
            print(f"warning: GitLab merge_requests lookup failed for {sha}: {e}", file=sys.stderr)
            mrs = []

        merged = [mr for mr in mrs if mr.get("state") == "merged"]
        labeled = [mr for mr in merged if label_name in (mr.get("labels") or [])]

        if not merged:
            print(f"No merged MR found for {sha} -- skipping evaluation (fail-closed)", file=sys.stderr)
        elif labeled:
            print(f"Merged MR !{labeled[0].get('iid')} has the '{label_name}' label -- evaluation approved", file=sys.stderr)
        else:
            iids = ", ".join(f"!{mr.get('iid')}" for mr in merged)
            print(f"Merged MR(s) {iids} found but none labeled '{label_name}' -- skipping evaluation", file=sys.stderr)

        print("true" if labeled else "false", end="")
        PYEOF
        echo "should-evaluate: $(cat "$(results.should-evaluate.path)")"
