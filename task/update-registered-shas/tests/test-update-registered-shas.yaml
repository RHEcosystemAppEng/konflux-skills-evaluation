# Exercises the should-evaluate="false" no-op path: the Task must exit
# cleanly without touching git at all. prepare-repo-dir pre-creates
# ./repo under the shared workspace since update-registered-shas'
# workingDir references it directly (it expects discover-changed-skills to
# have populated it in real usage).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-update-registered-shas
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script.
  tasks:
    - name: prepare-repo-dir
      workspaces:
        - name: source
          workspace: tests-workspace
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: mkdir-repo
            image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
            script: |
              #!/bin/bash
              set -e
              mkdir -p "$(workspaces.source.path)/repo"

    - name: run-update-registered-shas
      runAfter:
        - prepare-repo-dir
      taskRef:
        name: update-registered-shas
      params:
        - name: current-sha
          value: "deadbeef"
        - name: should-evaluate
          value: "false"
        - name: git-token-secret-name
          value: "test-dummy-gitlab-sa"
        - name: git-token-secret-key
          value: "password"
      workspaces:
        - name: source
          workspace: tests-workspace
