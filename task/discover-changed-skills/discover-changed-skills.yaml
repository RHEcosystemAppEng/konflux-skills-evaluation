# Discovers which items in a catalog changed since their registered SHA: runs
# a caller-supplied detection script (default
# scripts/detect_changed_skills.py, see that script's own docstring) against
# a full-history clone of the target repository, diffing each item's
# registered SHA against the current SHA.
#
# Needs a FULL (non-shallow) history clone to diff against an arbitrarily old
# registered SHA, so it does its own authenticated `git clone` here rather
# than reusing a pipeline's shallow trusted Source Artifact.
#
# Reusable across any GitLab-hosted repository that follows the same
# "registered SHA" bookkeeping convention as agentic-plugins (a detection
# script importable via `python3 <detect-script-path> --current-sha ... \
# --repo-root ... --format json`, emitting a JSON array of changed item
# identifiers) -- git-clone-url/git-ref/detect-script-path/git-token-secret-*
# are all parameterized below, defaulted to the values agentic-plugins
# itself uses.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: discover-changed-skills
  annotations:
    tekton.dev/tags: konflux
  labels:
    app.kubernetes.io/version: "0.1.0"
spec:
  description: >-
    Diffs every catalog item's registered SHA against the current SHA (via a
    caller-supplied detection script run against a full-history clone) and
    returns the ones that changed, as a JSON array of identifiers.
  params:
    - name: current-sha
      type: string
      description: Commit SHA under evaluation.
    - name: git-clone-url
      type: string
      default: "https://gitlab.cee.redhat.com/ai5-marketplace/agentic-plugins.git"
      description: >-
        HTTPS clone URL of the repository to check out and diff. An
        "oauth2:<token>@" userinfo prefix is injected automatically using
        git-token-secret-name/-key below.
    - name: detect-script-path
      type: string
      default: "scripts/detect_changed_skills.py"
      description: >-
        Path, relative to the repository root, of the detection script to
        run. Must accept --current-sha/--repo-root/--format json and emit a
        JSON array of changed item identifiers on stdout.
    - name: git-ssl-no-verify
      type: string
      default: "true"
      description: >-
        When "true", disables TLS certificate verification for the git
        clone (needed for internal GitLab instances with a private CA, as
        agentic-plugins' gitlab.cee.redhat.com is). Set to "false" for
        publicly-trusted GitLab instances (e.g. gitlab.com).
    - name: git-token-secret-name
      type: string
      default: "agentic-plugins-gitlab-sa"
      description: Name of the Secret containing a GitLab access token with clone access to the repository.
    - name: git-token-secret-key
      type: string
      default: "password"
      description: Key within git-token-secret-name holding the GitLab access token.
  workspaces:
    - name: source
      description: Scratch workspace the repository is cloned into (at ./repo).
  results:
    - name: changed-skills
      type: array
      description: Identifiers (in detect-script-path's own convention, e.g. rh-sre/cve-impact) that changed since their last registered SHA
  steps:
    - name: clone-and-detect
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: CURRENT_SHA
          value: $(params.current-sha)
        - name: GIT_CLONE_URL
          value: $(params.git-clone-url)
        - name: DETECT_SCRIPT_PATH
          value: $(params.detect-script-path)
        - name: GIT_SSL_NO_VERIFY_PARAM
          value: $(params.git-ssl-no-verify)
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.git-token-secret-name)
              key: $(params.git-token-secret-key)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet --no-cache-dir pyyaml

        # Internal GitLab instances (e.g. gitlab.cee.redhat.com) chain to a
        # private root CA this minimal image doesn't trust by default.
        if [ "$GIT_SSL_NO_VERIFY_PARAM" = "true" ]; then
          export GIT_SSL_NO_VERIFY=true
        fi

        REPO_DIR="$(workspaces.source.path)/repo"
        CLONE_URL_WITH_AUTH=$(printf '%s' "$GIT_CLONE_URL" | sed -E "s#^https://#https://oauth2:${GIT_TOKEN}@#")
        git clone --quiet "$CLONE_URL_WITH_AUTH" "${REPO_DIR}"
        cd "${REPO_DIR}"
        git fetch --quiet origin "$CURRENT_SHA" 2>/dev/null || true
        git checkout --quiet "$CURRENT_SHA"

        python3 "$DETECT_SCRIPT_PATH" \
          --current-sha "$CURRENT_SHA" \
          --repo-root "${REPO_DIR}" \
          --format json > "$(results.changed-skills.path)"

        echo "changed-skills result:"
        cat "$(results.changed-skills.path)"
        echo
