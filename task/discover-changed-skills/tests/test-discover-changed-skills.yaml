# Expects the referenced Task to fail: git-clone-url points at an
# unreachable host, so the clone can never succeed. This exercises the
# "fails loudly rather than silently" path (this Task has no onError
# tolerance, unlike aeh-skill-eval) -- see test_tekton_tasks.sh's
# `test/assert-task-failure` convention.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-discover-changed-skills
  annotations:
    test/assert-task-failure: run-discover-changed-skills
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script.
  tasks:
    - name: run-discover-changed-skills
      taskRef:
        name: discover-changed-skills
      params:
        - name: current-sha
          value: "deadbeef"
        - name: git-clone-url
          value: "https://127.0.0.1:1/does-not-exist.git"
        - name: git-token-secret-name
          value: "test-dummy-gitlab-sa"
        - name: git-token-secret-key
          value: "password"
      workspaces:
        - name: source
          workspace: tests-workspace
