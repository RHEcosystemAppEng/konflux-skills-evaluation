# Expects the referenced Task to fail: SOURCE_ARTIFACT points at a
# nonexistent OCI artifact, so use-trusted-artifact can never resolve it --
# see test_tekton_tasks.sh's `test/assert-task-failure` convention.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-aggregate-fanout-result
  annotations:
    test/assert-task-failure: run-aggregate-fanout-result
spec:
  workspaces:
    - name: tests-workspace
      description: The workspace provided by the test runner script (unused by this test).
  tasks:
    - name: run-aggregate-fanout-result
      taskRef:
        name: aggregate-fanout-result
      params:
        - name: SOURCE_ARTIFACT
          value: "localhost:5000/nonexistent/artifact:latest"
        - name: should-evaluate
          value: "true"
        - name: changed-skills
          value: []
        - name: eval-outcomes
          value: []
        - name: fail-on-non-success
          value: "false"
