# Trusted Artifacts (TA) exemptions.
#
# The `missing-ta-tasks` check (see SHARED-CI.md) requires every Task that
# declares a non-ignored workspace to have a `${task_name}-oci-ta` sibling
# variant. The three Tasks below are deliberately exempt: their `source`
# workspace is not used to pass build artifacts between sequential pipeline
# Tasks (the use case Trusted Artifacts/ADR36 targets) -- it is either a
# Matrix-shared scratch directory or a mutable git checkout that gets
# pushed back to, neither of which maps onto the OCI-Trusted-Artifact
# model without changing the Task's actual behavior.
#
# - task/aeh-skill-eval/aeh-skill-eval.yaml: `source` is a scratch PVC
#   shared by every concurrent Matrix leg (one leg per catalog item, see
#   the Task's own CONCURRENCY note); each leg computes its own
#   `legs/<slug>` subdirectory under it. The Task already consumes its
#   caller's actual trusted Source Artifact via the `source-artifact` param
#   + `use-trusted-artifact` step -- the workspace itself carries no data
#   between pipeline Tasks.
# - task/discover-changed-skills/discover-changed-skills.yaml: `source` is
#   where this Task performs its own authenticated, full-history
#   `git clone` (needed to diff against an arbitrarily old registered SHA --
#   a shallow trusted artifact wouldn't have the history). The clone is
#   also handed to update-registered-shas (below) to push from, which is
#   also not a Trusted-Artifact-compatible operation.
# - task/update-registered-shas/update-registered-shas.yaml: `source` must
#   contain a real, authenticated, writable git checkout (produced by
#   discover-changed-skills) so this Task can `git commit` + `git push`
#   back to the origin repository -- Trusted Artifacts are an immutable,
#   read-only snapshot mechanism and cannot represent a push-back.
paths:
  - task/aeh-skill-eval/aeh-skill-eval.yaml
  - task/discover-changed-skills/discover-changed-skills.yaml
  - task/update-registered-shas/update-registered-shas.yaml
